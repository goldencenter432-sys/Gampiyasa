name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4

      - name: Restore game project
        shell: bash
        run: |
          base64 -d gampiyasa-source.b64 > gampiyasa-source.zip
          unzip -o gampiyasa-source.zip
          test -f project.godot
          test -f scripts/main.gd

      - name: Import project
        shell: bash
        run: godot --headless --path . --editor --quit

      - name: Export APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" "build/android/GamPiyasaPrototype.apk"
          test -s build/android/GamPiyasaPrototype.apk
          ls -lh build/android/GamPiyasaPrototype.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GamPiyasaPrototype-Android
          path: build/android/GamPiyasaPrototype.apk
          if-no-files-found: error
