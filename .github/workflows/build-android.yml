name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, v0.2.1-environment-walawwa ]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Godot Android environment
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi
          echo "HOME=$HOME"
          godot --version
          command -v java || true
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type f -name 'android_debug.apk' -print || true

      - name: Import project
        shell: bash
        run: godot --headless --path . --editor --quit

      - name: Smoke test startup
        shell: bash
        run: |
          timeout 12s godot --headless --path . --editor --quit
          godot --headless --path . --path . --editor --quit 2>&1 | tee /tmp/godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-smoke.log; then
            exit 1
          fi

      - name: Export APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" "build/android/GamPiyasaPrototype.apk"
          test -s build/android/GamPiyasaPrototype.apk
          ls -lh build/android/GamPiyasaPrototype.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GamPiyasaPrototype-Android
          path: build/android/GamPiyasaPrototype.apk
          if-no-files-found: error
